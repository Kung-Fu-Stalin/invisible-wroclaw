[project]
name = "invisible-wroclaw"
version = "0.1.0"
description = "Excursion Telegram Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dynaconf>=3.3.5",
    "peewee>=4.5.3",
    "pillow>=13.0.0",
    "python-telegram-bot>=22.8",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pre-commit-hooks>=6.0.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]
